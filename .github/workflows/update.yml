name: Update list

on:
  schedule:
    # Twice a day. aiexpatjobs.com refreshes once a day, but GitHub often runs its schedule hours late.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild README.md and jobs.csv from the feed
        run: python scripts/build.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md jobs.csv
          git commit -m "Update list: $(date -u +%F)"
          git push
